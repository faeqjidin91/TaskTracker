services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tasktracker-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: tasktracker-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/TaskTracker.Api/Dockerfile
      args:
        DOTNET_TFM: ${DOTNET_TFM:-net10.0}
    container_name: tasktracker-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # This file is the local stack. Development applies migrations and seeds at startup.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TaskTracker;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      WebOrigin: "http://localhost:${WEB_PORT:-8090};http://127.0.0.1:${WEB_PORT:-8090}"
      Seed__SuperAdminEmail: ${Seed__SuperAdminEmail:-}
      Seed__SuperAdminPassword: ${Seed__SuperAdminPassword:-}
      Seed__OrganizationName: ${Seed__OrganizationName:-}
      Seed__AdminEmail: ${Seed__AdminEmail:-}
      Seed__AdminPassword: ${Seed__AdminPassword:-}
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8080"
    healthcheck:
      # The port opens only after migrations and seeding finish.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 7s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  web:
    image: tasktracker-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/TaskTracker.Web/Dockerfile
      args:
        DOTNET_TFM: ${DOTNET_TFM:-net10.0}
    container_name: tasktracker-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The browser calls the API, so this is the address on the host.
      API_BASE_URL: "http://localhost:${API_PORT:-8091}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlserver-data:
